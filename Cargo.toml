[package]
name = "tary"
version = "0.1.0"
edition = "2024"

[dependencies]
log = "^0.4"
pretty_env_logger = "^0.5"
toml = "^1.1.4"
serde = { version = "^1.0", features = ["derive"] }
clap = { version = "^4.6.6", features = ["derive"] }
dirs = "^6.0"
tokio = { version = "^1", features = ["rt", "macros", "rt-multi-thread", "sync", "net", "fs"] }
axum = { version = "0.8", features = ["json"] }
serde_json = "1"
inquire = "^0.9.4"
chrono = "^0.4.45"
escpos = { version = "^0.19.1", features = ["native_usb", "std"] }
nusb = "^0.2.7"
time = "^0.3.55"
async-trait = "0.1.92"
regex = "1.13.1"
